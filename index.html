<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class = "logo-side">
            <div class = "title-background">
                <img src="odin-lined.png" class = "odin-logo">
                <h1>Odin</h1>
            </div>

            <p class = "photo-credit">Photo by <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Halie West</a> on <a href="https://unsplash.com/">Unsplash</a></p>
        </div>
        <div class = "form-side">

            <h2>This is not a real online service!</h2>

            <form id="form">

                <div class="form-area">

                <h2>Let's do this!</h2>

                <div class="form-fields">
                <div class ="input-field">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name">
                </div>

                <div class ="input-field">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last-name">
                </div>

                <div class ="input-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
                </div>

                <div class ="input-field">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">
                </div>

                <div class ="input-field">
                <label for="pass">Password</label>
                <input type="password" id="pass" name="pass" required minlength="8">
                </div>

                <div class ="input-field">
                <label for="confirm-pass">Confirm Password</label>
                <input type="password" id="confirm-pass" name="confirm-pass" required minlength="8">
                </div>

                </div>
                </div>

                <button type="submit" class = "create">Create Account</button>

            </form>

            <p class="log-in">Already have an account? <span class="em">Log in</span></p>
        </div>
    </div>



    <script src="script.js"></script>
    
</body>
</html>
